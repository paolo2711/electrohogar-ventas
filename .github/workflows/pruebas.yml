# Corre la revisión de Django y las pruebas en cada push y en cada pull request
# hacia develop y main. Si algo falla, la PR lo muestra antes de fusionar.
# entrega.yml también lo llama antes de publicar una versión.
name: Pruebas

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar la configuración
        run: python manage.py check

      - name: Revisar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Correr las pruebas
        run: python manage.py test -v 2
